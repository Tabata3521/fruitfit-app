workflows:
  fruitfit-ios-app-store:
    name: FruitFit iOS App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: fruitfit_app_store_connect

    environment:
      ios_signing:
        certificates:
          - fruitfit_distribution
        provisioning_profiles:
          - fruitfit_app_store_profile
      xcode: latest
      node: latest
      vars:
        BUNDLE_ID: "com.tagirfruit.fruitfit"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Build bundled web assets
        script: |
          npm run build:ios-review

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
