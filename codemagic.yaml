workflows:
  fruitfit-ios-app-store:
    name: FruitFit iOS App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: fruitfit_app_store_connect

    environment:
      ios_signing:
        certificates:
          - fruitfit_distribution
        provisioning_profiles:
          - fruitfit_app_store_profile
      xcode: latest
      node: latest
      vars:
        BUNDLE_ID: "com.tagirfruit.fruitfit"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci

      - name: Build bundled web assets
        script: |
          npm run build:ios-review

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Verify iOS release configuration
        script: |
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.tagirfruit.fruitfit;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CURRENT_PROJECT_VERSION = 16;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 1.0.6;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.apple.developer.healthkit' ios/App/App/App.entitlements
          grep -q 'FruitFitAppIconPlugin.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'FruitFitAppMetricaPlugin.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'AppMetricaCore in Frameworks' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'AppMetricaAdSupport in Frameworks' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'NSUserTrackingUsageDescription' ios/App/App/Info.plist
          grep -q 'FruitFitAppMetricaAPIKey' ios/App/App/Info.plist
          grep -q 'NSPrivacyAccessedAPICategoryUserDefaults' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/FruitFitIconOrange@2x.png
          test -f ios/App/App/FruitFitIconPear@2x.png
          test -f ios/App/App/FruitFitIconApple@2x.png
          test -f ios/App/App/FruitFitIconStrawberry@2x.png
          test -f ios/App/App/GoogleService-Info.plist

      - name: Apply signing profiles to Xcode project
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
